<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    http-equiv="Permissions-Policy"
    content="microphone=(self 'https://script.google.com' 'https://script.googleusercontent.com'), camera=(self 'https://script.google.com' 'https://script.googleusercontent.com'), geolocation=(self 'https://script.google.com' 'https://script.googleusercontent.com')"
  >

  <title>Voice Changer AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06080F;
    }

    .wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06080F;
      color: #B6FF00;
      font-family: Arial, sans-serif;
      font-size: 14px;
      transition: opacity .3s ease;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 28px;
      height: 28px;
      margin-right: 10px;
      border: 3px solid rgba(182,255,0,.2);
      border-top-color: #B6FF00;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="loading" id="loading">
      <div class="loader"></div>
      Memuat Voice Changer AI...
    </div>

    <iframe
      id="voiceApp"
      src="https://script.google.com/macros/s/AKfycbzNU1W_4-7dUnSLku3UopRVfrwcorZ4VaDY2Cd9a_I4M1SExTAywxGHMPm9iqlIgMHP/exec"
      allow="microphone *; camera *; geolocation *; autoplay *"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </div>

  <script>
    const iframe = document.getElementById("voiceApp");
    const loading = document.getElementById("loading");

    iframe.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hide");
      }, 500);
    });
  </script>

</body>
</html>
