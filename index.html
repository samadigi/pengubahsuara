<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Voice Changer AI</title>

  <meta
    http-equiv="Permissions-Policy"
    content="microphone=(self 'https://script.google.com' 'https://script.googleusercontent.com'), camera=(self 'https://script.google.com' 'https://script.googleusercontent.com'), geolocation=(self 'https://script.google.com' 'https://script.googleusercontent.com')"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06080F;
    }

    .wrapper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <iframe
      src="https://script.google.com/macros/s/AKfycbzNU1W_4-7dUnSLku3UopRVfrwcorZ4VaDY2Cd9a_I4M1SExTAywxGHMPm9iqlIgMHP/exec"
      allow="microphone; camera; geolocation; autoplay"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

  </div>

</body>
</html>
